name: Pre-PR mobile responsive validation

on:
  push:
    branches: [validation/mobile-responsive-editor]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile stays unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck and build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive E2E
        run: npx playwright test e2e/responsive.spec.ts --workers=1

      - name: Responsive E2E serial stress
        run: npx playwright test e2e/responsive.spec.ts --repeat-each=5 --workers=1

      - name: Responsive E2E parallel stress
        run: npx playwright test e2e/responsive.spec.ts --repeat-each=5 --workers=4

      - name: Full Playwright suite
        run: npm test

      - name: Diff whitespace check
        run: git diff --check 9f5a2746c9bebc70c2fa18d69cb09a4efbcfb39d...HEAD

      - name: Clean worktree
        run: test -z "$(git status --porcelain)"
